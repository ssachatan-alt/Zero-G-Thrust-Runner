<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zero-G Thrust Runner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="hud">
    <div>DISTANCE: <span id="score">0</span> m</div>
    <div>BEST: <span id="best">0</span> m</div>
  </div>

  <canvas id="gameCanvas" width="800" height="450"></canvas>
  <div class="hint">Hold <strong>SPACE</strong> or <strong>LEFT CLICK / TOUCH</strong> to fire thrusters</div>

  <script src="script.js"></script>
</body>
</html>
